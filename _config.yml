# `title` shows in the header and browser tab; `description` shows in the footer and in search/social previews.
title: Yap City
description: Analyses and opinion pieces on things I find interesting.
author: Michael
url: "https://crynom.github.io"

# Theme pulled from GitHub at build time, pinned to a release so upstream changes never alter the site unannounced.
remote_theme: riggraz/no-style-please@v0.3.1
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

theme_config:
  # Keep "light": the dark palette is set directly in assets/css/main.scss.
  # The theme's own "dark" mode inverts all colors, which would turn our accents into their opposites.
  appearance: "light"
  back_home_text: ".."
  date_format: "%Y-%m-%d"
  show_description: true
  lowercase_titles: true

# Posts are dated in Eastern time; without this, GitHub builds in UTC and late-evening posts shift a day.
timezone: America/New_York
permalink: /:year/:month/:day/:title/
exclude:
  - README.md
